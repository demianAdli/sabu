openapi: 3.0.2
info:
  title: JUG GIS Validation API
  version: v1
  description: |
    OpenAPI contract for the GISOO validation service.

    The service validates a buildings_set GeoJSON FeatureCollection against
    packaged census validation data. The default census file is
    `data/filtered_census.csv`, owned and packaged by `jug_gis_validation`.

    The primary input mode is a pasted GeoJSON FeatureCollection, following the
    `jug_lca_buildings` building-input pattern and adding validation fields.
    `fsa` is required; area fields are required only by the selected area mode.

    Standalone `POST /uniquifications` requires only identifier and ranking-area
    columns and never loads census data, runs comparisons, or generates plots.
servers:
  - url: http://localhost:5000
    description: Local Flask development
  - url: http://localhost:8082
    description: Local Docker Compose
paths:
  /uniquifications:
    post:
      summary: Uniquify features without census processing
      operationId: uniquifyGISFeatures
      tags: [GIS Uniquifications]
      description: |
        Keep the greatest configured numeric area per non-missing identifier.
        Equal maximum areas retain the earliest input record. Null/blank
        identifiers remain independent. Invalid areas fail only in duplicate
        groups. Retained features preserve input order; inputs are never rewritten.
        File inputs use the same JSON conversion as inline inputs.
        No query options, census fields, or comparison options are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniquificationRequest'
            example:
              buildings_set_path: /data/gis/input.geojson
              unique_attribute_key: roll_provincial_id
              area_key: citygisoo_area
      responses:
        '200':
          description: Retained GeoJSON, counts, and one trace entry per input record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniquificationResponse'
        '400':
          description: Invalid JSON, unreadable input, malformed GeoJSON, or unsupported query options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request fields, missing configured columns, unusable identifiers, or invalid duplicate-group areas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected failure with a generic public message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /validations:
    post:
      summary: Validate a buildings_set from pasted GeoJSON content or a server path
      operationId: createGISValidation
      tags: [GIS Validations]
      parameters:
        - in: query
          name: export
          required: false
          description: Optional export format. Use `csv`, `plot`, or `geojson` for the uniquified feature snapshot.
          schema:
            type: string
            enum: [csv, plot, geojson]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BuildingsSet'
                - $ref: '#/components/schemas/ValidationRequest'
            examples:
              rawGeoJSON:
                summary: Raw buildings_set FeatureCollection
                value:
                  type: FeatureCollection
                  features:
                    - type: Feature
                      id: 1
                      geometry:
                        type: Polygon
                        coordinates:
                          - - [-71.214, 46.813]
                            - [-71.213, 46.813]
                            - [-71.213, 46.814]
                            - [-71.214, 46.814]
                            - [-71.214, 46.813]
                      properties:
                        name: Validation Building 1
                        address: 1 Example St
                        function: '1000'
                        height: 10.5
                        year_of_construction: 1995
                        fsa: G1A
                        area: 120.0
                        floor_num: 3
              pathRequest:
                summary: Server-path request
                value:
                  buildings_set_path: /data/gis/QuebecCity.geojson
                  district_name: quebec_city
      responses:
        '200':
          description: Export generated successfully when `export=csv` or `export=plot`.
          content:
            text/csv:
              schema:
                type: string
              examples:
                csvReport:
                  summary: Validation CSV report
                  value: |
                    FSA,Cleaned Units Num,Census Units Num,Cleaned vs. Census Units,Cleaned Total Area,Census Total Area (by type)
                    G1A,1,8,-7,360.0,320.0
            image/png:
              schema:
                type: string
                format: binary
              description: PNG area-comparison plot.
            application/geo+json:
              schema:
                $ref: '#/components/schemas/BuildingsSet'
              description: Uniquified feature snapshot. Requires unique_attribute_key.
        '201':
          description: Validation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                jsonResult:
                  summary: Validation JSON response
                  value:
                    codes: [G1A]
                    rows_count: 1
                    area_calculation_mode: area-times-floor
                    height_proxy_included: false
                    height_proxy_area_key: null
                    height_proxy_area_resolution: null
                    uniquification:
                      applied: false
                      unique_attribute_key: null
                      ranking_area_key: null
                      input_features: 1
                      retained_features: 1
                      removed_features: 0
                      duplicate_groups: 0
                    comparison_table:
                      - FSA: G1A
                        Cleaned Units Num: 1
                        Census Units Num: 8
                        Cleaned vs. Census Units: -7
                        Cleaned Total Area: 360.0
                        Census Total Area (by type): 320.0
        '400':
          description: Bad request, including invalid JSON or unsupported export format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error for request payload or buildings_set data contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Validation workflow failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /validations/upload:
    post:
      summary: Validate a buildings_set from an uploaded GeoJSON file
      operationId: uploadGISValidation
      tags: [GIS Validations]
      parameters:
        - in: query
          name: export
          required: false
          description: Optional export format. Use `csv`, `plot`, or `geojson` for the uniquified feature snapshot.
          schema:
            type: string
            enum: [csv, plot, geojson]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [geojson_file]
              properties:
                geojson_file:
                  type: string
                  format: binary
                  description: GeoJSON file containing a buildings_set FeatureCollection.
                census_code_field_title:
                  type: string
                  default: ALT_GEO_CODE
                census_units_num_title:
                  type: string
                  default: C1_COUNT_TOTAL
                postal_code_key:
                  type: string
                  default: fsa
                function_key:
                  type: string
                  default: function
                function_value:
                  type: string
                  default: '1000'
                cleaned_units_num_key:
                  type: string
                  nullable: true
                  description: Optional feature property containing unit counts. NULL values contribute one; when omitted, each retained feature contributes one.
                area_key:
                  type: string
                  default: area
                floor_num_key:
                  type: string
                  default: floor_num
                area_calculation_mode:
                  type: string
                  enum: [none, area-only, area-times-floor]
                  default: area-times-floor
                height_key:
                  type: string
                  default: height
                include_height_proxy:
                  type: boolean
                  default: false
                  description: Include a separate height-derived area diagnostic. Cannot be true when area_calculation_mode is none.
                height_proxy_area_key:
                  type: string
                  nullable: true
                  description: Optional base-area field used only by the height proxy. Defaults to area_key.
                height_proxy_area_fallback_key:
                  type: string
                  nullable: true
                  description: Optional fallback field; mutually exclusive with height_proxy_area_fallback_value.
                height_proxy_area_fallback_value:
                  type: number
                  format: float
                  nullable: true
                  minimum: 0
                  exclusiveMinimum: true
                  description: Positive constant fallback. Defaults internally to 80 when neither fallback option is supplied.
                unique_attribute_key:
                  type: string
                  nullable: true
                  description: Optional attribute to uniquify for validation.
                uniquification_area_key:
                  type: string
                  nullable: true
                  description: Optional area field used only to rank duplicate features. Defaults to area_key.
                district_name:
                  type: string
                  default: validation
                plot_title:
                  type: string
      responses:
        '200':
          description: Export generated successfully when `export=csv` or `export=plot`.
          content:
            text/csv:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
              description: PNG area-comparison plot.
            application/geo+json:
              schema:
                $ref: '#/components/schemas/BuildingsSet'
              description: Uniquified feature snapshot. Requires unique_attribute_key.
        '201':
          description: Validation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          description: Missing file, invalid uploaded JSON, or unsupported export format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Uploaded GeoJSON schema validation error or buildings_set data-contract error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Validation workflow failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    UniquificationRequest:
      type: object
      required: [unique_attribute_key]
      additionalProperties: false
      oneOf:
        - required: [buildings_set]
        - required: [buildings_set_path]
      properties:
        buildings_set:
          $ref: '#/components/schemas/StandaloneFeatureCollection'
        buildings_set_path:
          type: string
          pattern: '\S'
          description: GeoJSON file path visible to the service.
        unique_attribute_key:
          type: string
          pattern: '\S'
        area_key:
          type: string
          pattern: '\S'
          default: area
          description: Ranking column; no geometric area calculation is performed.
    StandaloneFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type:
                type: string
                enum: [Feature]
              id:
                oneOf:
                  - type: string
                  - type: number
              geometry:
                type: object
                nullable: true
                description: Any GeoJSON geometry supported by the existing loader, or null.
              properties:
                type: object
                additionalProperties: true
                description: No census, postal-code, function, floor, or height fields are required.
    UniquificationResponse:
      type: object
      required: [uniquification, retained_geojson, records]
      additionalProperties: false
      properties:
        uniquification:
          $ref: '#/components/schemas/FeatureUniquificationStats'
        retained_geojson:
          $ref: '#/components/schemas/StandaloneFeatureCollection'
        records:
          type: array
          items:
            $ref: '#/components/schemas/UniquificationRecord'
          description: One entry per input position; statuses reconcile with counts and retained GeoJSON length.
    UniquificationRecord:
      type: object
      additionalProperties: false
      required:
        - record_ref
        - input_position
        - identifier
        - area
        - status
        - retained_record_ref
        - retained_feature_index
        - reason
      properties:
        record_ref:
          type: string
          pattern: '^record:[0-9]+$'
          description: Position-based identity within this ordered input, independent of source IDs and index labels.
        input_position:
          type: integer
          minimum: 0
        identifier:
          description: Configured identifier value; missing/non-finite scalars serialize as null.
        area:
          description: Configured area value before numeric ranking conversion; missing/non-finite scalars serialize as null.
        status:
          type: string
          enum: [retained, removed]
        retained_record_ref:
          type: string
          pattern: '^record:[0-9]+$'
          description: Winning record reference; retained records point to themselves.
        retained_feature_index:
          type: integer
          minimum: 0
          description: Zero-based index into retained_geojson.features.
        reason:
          type: string
          enum: [missing_identifier, unique_identifier, largest_area, earliest_maximum_area, smaller_area, later_tied_maximum]
    BuildingsSet:
      type: object
      required: [type, features]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BuildingsSetFeature'
    BuildingsSetFeature:
      type: object
      required: [type, id, geometry, properties]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          oneOf:
            - type: integer
            - type: string
        geometry:
          $ref: '#/components/schemas/BuildingsSetGeometry'
        properties:
          $ref: '#/components/schemas/BuildingsSetProperties'
    BuildingsSetGeometry:
      type: object
      required: [type, coordinates]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array
          description: GeoJSON polygon or multipolygon coordinates.
    BuildingsSetProperties:
      type: object
      required:
        - name
        - function
        - year_of_construction
        - fsa
      additionalProperties: true
      properties:
        name:
          type: string
        address:
          type: string
        function:
          oneOf:
            - type: string
            - type: integer
        height:
          type: number
          format: float
          description: Required only when the height-proxy diagnostic is enabled.
        year_of_construction:
          oneOf:
            - type: integer
            - type: string
        fsa:
          type: string
          description: Forward sortation area or postal-code prefix used as the validation district code.
        area:
          type: number
          format: float
          description: Feature area, interpreted according to area_calculation_mode.
        floor_num:
          type: number
          format: float
          description: Required by the area-times-floor calculation mode.
        unit_num:
          type: integer
          minimum: 0
          nullable: true
          description: Example per-feature unit count selectable through cleaned_units_num_key. NULL contributes one unit.
    ValidationRequest:
      type: object
      description: Wrapped validation request. The API also accepts a raw BuildingsSet directly.
      oneOf:
        - required: [buildings_set]
        - required: [buildings_set_path]
      additionalProperties: false
      properties:
        buildings_set:
          $ref: '#/components/schemas/BuildingsSet'
        buildings_set_path:
          type: string
          description: Path to a GeoJSON file visible to the running service.
          example: /data/gis/QuebecCity.geojson
        census_code_field_title:
          type: string
          default: ALT_GEO_CODE
        census_units_num_title:
          type: string
          default: C1_COUNT_TOTAL
        postal_code_key:
          type: string
          default: fsa
        function_key:
          type: string
          default: function
        function_value:
          oneOf:
            - type: string
            - type: integer
            - type: number
          default: '1000'
        cleaned_units_num_key:
          type: string
          nullable: true
          description: Optional feature property containing unit counts. NULL values contribute one; when omitted, each retained feature contributes one.
        area_key:
          type: string
          default: area
        floor_num_key:
          type: string
          default: floor_num
        area_calculation_mode:
          type: string
          enum: [none, area-only, area-times-floor]
          default: area-times-floor
          description: Disable area comparison, use area_key directly, or multiply it by floor_num_key.
        height_key:
          type: string
          default: height
        include_height_proxy:
          type: boolean
          default: false
          description: Include a separate height-derived area diagnostic. Cannot be true when area_calculation_mode is none.
        height_proxy_area_key:
          type: string
          nullable: true
          description: Optional base-area field used only by the height proxy. Defaults to area_key.
        height_proxy_area_fallback_key:
          type: string
          nullable: true
          description: Optional fallback field; mutually exclusive with height_proxy_area_fallback_value.
        height_proxy_area_fallback_value:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: Positive constant fallback. Defaults internally to 80 when neither fallback option is supplied.
        unique_attribute_key:
          type: string
          nullable: true
          description: Optional attribute to uniquify for validation.
        uniquification_area_key:
          type: string
          nullable: true
          description: Optional area field used only to rank duplicate features. Defaults to area_key.
        census_avg_area_by_type:
          type: object
          additionalProperties:
            type: number
          description: Optional override of average dwelling areas by census characteristic label.
        district_name:
          type: string
          default: validation
        plot_title:
          type: string
          nullable: true
    ValidationResponse:
      type: object
      required:
        - codes
        - rows_count
        - comparison_table
        - uniquification
        - area_calculation_mode
        - height_proxy_included
        - height_proxy_area_key
        - height_proxy_area_resolution
      additionalProperties: false
      properties:
        codes:
          type: array
          items:
            type: string
        rows_count:
          type: integer
          minimum: 0
        comparison_table:
          type: array
          items:
            $ref: '#/components/schemas/ValidationComparisonRow'
        uniquification:
          $ref: '#/components/schemas/FeatureUniquificationStats'
        area_calculation_mode:
          type: string
          enum: [none, area-only, area-times-floor]
        height_proxy_included:
          type: boolean
        height_proxy_area_key:
          type: string
          nullable: true
        height_proxy_area_resolution:
          allOf:
            - $ref: '#/components/schemas/HeightProxyAreaResolution'
          nullable: true
    HeightProxyAreaResolution:
      type: object
      additionalProperties: false
      required:
        - primary_area_key
        - fallback_type
        - fallback_key
        - fallback_value
        - evaluated_features
        - primary_features
        - fallback_features
        - fallback_percentage
        - unresolved_features
      properties:
        primary_area_key:
          type: string
        fallback_type:
          type: string
          enum: [field, constant]
        fallback_key:
          type: string
          nullable: true
        fallback_value:
          type: number
          format: float
          nullable: true
        evaluated_features:
          type: integer
          minimum: 0
        primary_features:
          type: integer
          minimum: 0
        fallback_features:
          type: integer
          minimum: 0
        fallback_percentage:
          type: number
          minimum: 0
          maximum: 100
        unresolved_features:
          type: integer
          minimum: 0
    FeatureUniquificationStats:
      type: object
      additionalProperties: false
      required:
        - applied
        - unique_attribute_key
        - ranking_area_key
        - input_features
        - retained_features
        - removed_features
        - duplicate_groups
      properties:
        applied:
          type: boolean
        unique_attribute_key:
          type: string
          nullable: true
        ranking_area_key:
          type: string
          nullable: true
        input_features:
          type: integer
          minimum: 0
        retained_features:
          type: integer
          minimum: 0
        removed_features:
          type: integer
          minimum: 0
        duplicate_groups:
          type: integer
          minimum: 0
    ValidationComparisonRow:
      type: object
      required:
        - FSA
        - Cleaned Units Num
        - Census Units Num
        - Cleaned vs. Census Units
      additionalProperties: true
      properties:
        FSA:
          type: string
        Cleaned Units Num:
          type: number
          nullable: true
        Census Units Num:
          type: number
          nullable: true
        Cleaned vs. Census Units:
          type: number
          nullable: true
        Cleaned Total Area:
          type: number
          nullable: true
        Cleaned Total Area (height proxy):
          type: number
          nullable: true
        Height Proxy Area Fallback Type:
          type: string
          enum: [field, constant]
        Height Proxy Area Fallback Features:
          type: integer
          minimum: 0
        Height Proxy Area Fallback Percentage:
          type: number
          minimum: 0
          maximum: 100
        Census Total Area (by type):
          type: number
          nullable: true
    ErrorResponse:
      type: object
      required: [message]
      properties:
        code:
          type: integer
          example: 400
        status:
          type: string
          example: Bad Request
        message:
          type: string
          example: Failed to run GIS validation
        errors:
          type: object
          additionalProperties: true
      additionalProperties: true
