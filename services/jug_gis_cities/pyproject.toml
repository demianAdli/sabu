[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jug_gis_cities"
version = "0.1.0"
description = "Geospatial data cleaning."
authors = [
  { name = "Alireza Adli" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"


dependencies = [
  "citygisoo>=0.2.1",
  "flask==3.1.1",            
  "flask-smorest==0.46.1",
  "marshmallow>=3.24.1,<5",
  "sabu-chassis>=0.1.1",
  "geopandas",
  "shapely>=2",
  "pyproj",
  "requests>=2.32,<3",
  "pandas"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["jug_gis_cities*"]
