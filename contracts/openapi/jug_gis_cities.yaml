openapi: 3.0.2
info:
  title: JUG GIS Cities Workflow API
  version: v1
  description: |
    OpenAPI contract for the city GIS cleaning service.

    The currently implemented API triggers a named municipality component and
    returns metadata about output files written by that component.

    `standardize` mode runs the component workflow and then the contract
    adapter. The standardized output is a strict building GeoJSON contract with
    standardized attribute names, unnecessary fields removed, and generated ids
    promoted as GeoJSON feature ids. Null-attribute feature deletion is opt-in
    through `drop_null_fields`.

    `independent` mode runs only the component workflow. Its output is flexible
    and component-native, so it is not guaranteed to match the standardized
    building GeoJSON contract.

    Source datasets are intentionally not embedded in API requests. Role-based
    dataset manifests are documented as reusable component schemas for direct,
    Docker, and future API-oriented execution. The single-run endpoint accepts
    `mode` and an optional `fsa`. FSA-capable components can also be submitted
    as persistent asynchronous batches for selected or component-configured
    FSAs.

    Successful standardized outputs are registered as immutable GeoJSON copies.
    Run responses and successful per-FSA results include an artifact ID and an
    absolute HTTP download URL. Downloading never executes preprocessing.
    Registrations and copies survive restarts when the artifact directory is
    persisted; workflow cleanup does not remove them. Copies are retained
    indefinitely unless deliberately removed by an operator. Existing batch
    records without registrations expose null artifact fields.
servers:
  - url: http://localhost:5000
    description: Local Flask development
  - url: http://localhost:8081
    description: Local Docker Compose
paths:
  /components/{component_name}/runs:
    post:
      summary: Run a GIS city component
      operationId: createGISComponentRun
      tags: [GIS Components]
      parameters:
        - in: path
          name: component_name
          required: true
          description: Component package name, for example `saint_malachie_gisoo`.
          schema:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          example: saint_malachie_gisoo
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GISComponentRunRequest'
            examples:
              standardize:
                summary: Run workflow and contract adapter
                value:
                  mode: standardize
              independent:
                summary: Run only workflow.py
                value:
                  mode: independent
              montrealFsa:
                summary: Run the Montreal FSA workflow for H3H
                value:
                  mode: independent
                  fsa: H3H
              montrealFsaStandardizeDropNull:
                summary: Run Montreal FSA standardization with explicit null deletion
                value:
                  mode: standardize
                  fsa: H3H
                  drop_null_fields:
                    - citygisoo_id
                    - FSA
                    - citygisoo_area
      responses:
        '201':
          description: Component run completed and output metadata returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GISComponentRunResponse'
              examples:
                standardize:
                  summary: Standardized execution response
                  value:
                    component_name: saint_malachie_gisoo
                    mode: standardize
                    fsa: null
                    workflow_output_path: /data/output/saint_malachie_gisoo_with_fsa/saint_malachie_gisoo_with_fsa.shp
                    standardized_output_path: /data/output/saint_malachie_standardized/saint_malachie_standardized.geojson
                    standardized_artifact_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    standardized_download_url: http://localhost:5000/artifacts/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/download
                    cleaned_output_paths: []
                independent:
                  summary: Independent execution response
                  value:
                    component_name: saint_malachie_gisoo
                    mode: independent
                    fsa: null
                    workflow_output_path: /data/output/saint_malachie_gisoo_with_fsa/saint_malachie_gisoo_with_fsa.shp
                    standardized_output_path: null
                    standardized_artifact_id: null
                    standardized_download_url: null
                    cleaned_output_paths: []
                montrealFsa:
                  summary: Montreal FSA independent execution response
                  value:
                    component_name: mtl_fsa_gisoo
                    mode: independent
                    fsa: H3H
                    workflow_output_path: /data/output/H3H/mtl_fsa_gisoo/mtl_fsa_gisoo.shp
                    standardized_output_path: null
                    standardized_artifact_id: null
                    standardized_download_url: null
                    cleaned_output_paths: []
        '400':
          description: Bad request, including invalid component-name values that are not valid Python package names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidComponentName:
                  value:
                    code: 400
                    status: Bad Request
                    message: 'component_name must be a valid Python package name.'
        '404':
          description: Requested component package was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                componentNotFound:
                  value:
                    code: 404
                    status: Not Found
                    message: 'GIS city component not found: unknown_municipality_gisoo'
        '422':
          description: Request validation error, or component exists but does not implement the expected workflow/adapter contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidMode:
                  value:
                    code: 422
                    status: Unprocessable Entity
                    message: Validation error
                    errors:
                      json:
                        mode:
                          - 'Must be one of: independent, standardize.'
                componentContractError:
                  value:
                    code: 422
                    status: Unprocessable Entity
                    message: 'GIS city component mtl_gisoo.workflow must define callable run_workflow().'
        '500':
          description: Component execution failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The component/FSA output is already being processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /components/{component_name}/batch-runs:
    post:
      summary: Submit an asynchronous FSA batch
      operationId: createGISComponentBatchRun
      tags: [GIS Components]
      parameters:
        - $ref: '#/components/parameters/ComponentName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FsaBatchRunRequest'
            examples:
              allFsas:
                value:
                  mode: standardize
                  all_fsas: true
                  max_workers: 3
                  cleanup_outputs: true
                  keep_outputs: [usage_clean, inter_summary]
              selectedFsas:
                value:
                  mode: standardize
                  fsas: [H3H, H2X]
                  max_workers: 3
      responses:
        '202':
          description: Batch persisted in the queue for worker execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsaBatchJob'
        '400':
          description: Invalid component or batch configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Requested component package was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation or FSA workflow contract error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /components/{component_name}/batch-runs/{batch_id}:
    get:
      summary: Get FSA batch progress and per-FSA results
      operationId: getGISComponentBatchRun
      tags: [GIS Components]
      parameters:
        - $ref: '#/components/parameters/ComponentName'
        - in: path
          name: batch_id
          required: true
          schema:
            type: string
          description: Persistent batch identifier returned by batch submission.
      responses:
        '200':
          description: Current persistent batch status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsaBatchJob'
        '404':
          description: Batch was not found for this component.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /artifacts/{artifact_id}/download:
    get:
      summary: Download a registered standardized GeoJSON
      operationId: downloadGISArtifact
      tags: [GIS Components]
      description: |
        Serves the stored immutable copy without executing a workflow or adapter.
        Only registered IDs are accepted; filesystem paths cannot be supplied.
        Reruns receive new IDs and cannot replace earlier artifacts.
      parameters:
        - in: path
          name: artifact_id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
      responses:
        '200':
          description: Registered GeoJSON attachment.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment with an artifact-ID-based .geojson filename.
          content:
            application/geo+json:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown or malformed artifact ID, including unregistered files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Registered copy is missing, truncated, or resolves outside its artifact location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Artifact registry or unexpected file read failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    ComponentName:
      in: path
      name: component_name
      required: true
      description: FSA-capable component package name.
      schema:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
  schemas:
    GISComponentRunRequest:
      type: object
      description: |
        Request body currently accepted by POST /components/{component_name}/runs.
        If omitted by the application layer, mode defaults to `standardize`.
        The `fsa` field is required only for components whose workflow requires
        FSA district selection. `drop_null_fields` is optional; when omitted,
        standardized runs do not delete features based on null attributes.
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [independent, standardize]
          default: standardize
          description: |
            `independent` runs only workflow.py. `standardize` runs workflow.py
            and then contract_adapter.py.
        fsa:
          type: string
          nullable: true
          pattern: '^[A-Za-z][0-9][A-Za-z]$'
          description: |
            Optional three-character Canadian Forward Sortation Area. Required
            by `mtl_fsa_gisoo`; normalized to uppercase by the service.
          example: H3H
        drop_null_fields:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
          description: |
            Optional standardized field names that must be non-null in
            `standardize` mode. Features with null or empty values in any
            listed field are deleted. Omit this field, or set it to null, to
            keep features regardless of sparse optional attributes.
          example: [citygisoo_id, FSA, citygisoo_area]
        cleanup_outputs:
          type: boolean
          default: false
          description: Delete unretained intermediate outputs after success.
        keep_outputs:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
          description: Additional workflow output keys retained during cleanup.
    GISComponentRunResponse:
      type: object
      required:
        - component_name
        - mode
        - fsa
        - workflow_output_path
        - standardized_output_path
        - standardized_artifact_id
        - standardized_download_url
        - cleaned_output_paths
      additionalProperties: false
      properties:
        component_name:
          type: string
          example: saint_malachie_gisoo
        mode:
          type: string
          enum: [independent, standardize]
        fsa:
          type: string
          nullable: true
          description: Normalized FSA used for the run, or null when unused.
          example: H3H
        workflow_output_path:
          type: string
          description: Component-native workflow output path.
          example: /data/output/saint_malachie_gisoo_with_fsa/saint_malachie_gisoo_with_fsa.shp
        standardized_output_path:
          type: string
          nullable: true
          description: |
            GeoJSON path produced by the contract adapter in `standardize`
            mode. Null for `independent` mode.
          example: /data/output/saint_malachie_standardized/saint_malachie_standardized.geojson
        standardized_artifact_id:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{32}$'
          description: Immutable registered GeoJSON ID; null in independent mode.
        standardized_download_url:
          type: string
          format: uri
          nullable: true
          description: Absolute HTTP URL for the registered copy; null in independent mode.
        cleaned_output_paths:
          type: array
          items:
            type: string
          description: Output paths removed by cleanup; empty when cleanup is disabled.
    FsaBatchRunRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [fsas]
        - required: [all_fsas]
          properties:
            all_fsas:
              enum: [true]
      properties:
        mode:
          type: string
          enum: [independent, standardize]
          default: standardize
        fsas:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[A-Za-z][0-9][A-Za-z]$'
          description: Selected FSAs; normalized, deduplicated, and run in this order.
        all_fsas:
          type: boolean
          default: false
          description: Discover sorted FSAs from the component workflow configuration.
        max_workers:
          type: integer
          minimum: 1
          default: 1
        drop_null_fields:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
        cleanup_outputs:
          type: boolean
          default: false
        keep_outputs:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
    FsaBatchItemResult:
      type: object
      required:
        - fsa
        - succeeded
        - workflow_output_path
        - standardized_output_path
        - standardized_artifact_id
        - standardized_download_url
        - cleaned_output_paths
        - error
        - elapsed_seconds
      additionalProperties: false
      properties:
        fsa:
          type: string
          pattern: '^[A-Z][0-9][A-Z]$'
        succeeded:
          type: boolean
        workflow_output_path:
          type: string
          nullable: true
        standardized_output_path:
          type: string
          nullable: true
        standardized_artifact_id:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{32}$'
          description: Null for failures, independent runs, and legacy unregistered results.
        standardized_download_url:
          type: string
          format: uri
          nullable: true
          description: Absolute HTTP URL for this FSA's registered copy, or null.
        cleaned_output_paths:
          type: array
          items:
            type: string
        error:
          type: string
          nullable: true
        elapsed_seconds:
          type: number
          minimum: 0
    FsaBatchJob:
      type: object
      required:
        - batch_id
        - component_name
        - mode
        - status
        - all_fsas
        - fsas
        - max_workers
        - cleanup_outputs
        - keep_outputs
        - total_count
        - completed_count
        - succeeded_count
        - failed_count
        - results
        - error
        - created_at
        - updated_at
        - started_at
        - finished_at
      additionalProperties: false
      properties:
        batch_id:
          type: string
        component_name:
          type: string
        mode:
          type: string
          enum: [independent, standardize]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        all_fsas:
          type: boolean
        fsas:
          type: array
          nullable: true
          items:
            type: string
        max_workers:
          type: integer
          minimum: 1
        cleanup_outputs:
          type: boolean
        keep_outputs:
          type: array
          nullable: true
          items:
            type: string
        total_count:
          type: integer
          minimum: 0
        completed_count:
          type: integer
          minimum: 0
        succeeded_count:
          type: integer
          minimum: 0
        failed_count:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/FsaBatchItemResult'
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    InputDatasetManifest:
      type: object
      description: |
        Reference to one source dataset. This schema documents flexible
        direct/Docker/future API configuration and is not accepted by the
        current POST /components/{component_name}/runs endpoint.
      required: [role, path_or_uri, format]
      additionalProperties: false
      properties:
        role:
          type: string
          example: height_source
        path_or_uri:
          type: string
          example: /data/input/height_source.gpkg
        format:
          type: string
          enum: [shp, geojson, json, gpkg, tif, tiff, laz, las, csv, parquet, other]
        layer_name:
          type: string
          example: nrcan_heights
        declared_crs:
          type: string
          example: EPSG:4326
        field_mappings:
          type: object
          additionalProperties:
            type: string
          example:
            height: heightmax
        municipality:
          type: string
        workflow_identifier:
          type: string
        metadata:
          type: object
          additionalProperties: true
    WorkflowInputConfig:
      type: object
      description: |
        Role-based workflow input configuration for direct/Docker/future
        API-oriented execution. TODO: add an endpoint that accepts this manifest
        if remote workflow configuration becomes part of the service API.
      required: [manifest_version, service, component_name, datasets]
      additionalProperties: false
      properties:
        manifest_version:
          type: string
          example: '1.0'
        service:
          type: string
          enum: [jug_gis_cities]
        component_name:
          type: string
          example: saint_malachie_gisoo
        municipality:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            province_or_region:
              type: string
            country:
              type: string
            identifier:
              type: string
        workflow_identifier:
          type: string
        qgis_prefix_path:
          type: string
          example: /usr
        datasets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InputDatasetManifest'
        outputs:
          type: object
          properties:
            workflow_output:
              $ref: '#/components/schemas/OutputReference'
            standardized_output:
              $ref: '#/components/schemas/OutputReference'
        metadata:
          type: object
          additionalProperties: true
    OutputReference:
      type: object
      required: [path_or_uri, format]
      additionalProperties: false
      properties:
        path_or_uri:
          type: string
          example: /data/output/standardized.geojson
        format:
          type: string
          enum: [shp, geojson, json, gpkg, other]
        layer_name:
          type: string
    StandardizedBuildingGeoJSON:
      type: object
      description: Strict GeoJSON output produced by standardize mode.
      required: [type, features]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/StandardizedBuildingFeature'
    StandardizedBuildingFeature:
      type: object
      required: [type, id, geometry, properties]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: integer
          description: Generated id promoted to the GeoJSON feature id.
        geometry:
          type: object
          required: [type, coordinates]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon]
            coordinates:
              type: array
        properties:
          $ref: '#/components/schemas/StandardizedBuildingProperties'
    StandardizedBuildingProperties:
      type: object
      required:
        - name
        - height
        - function
        - address
        - year_of_construction
      additionalProperties: false
      properties:
        name:
          type: string
        height:
          type: number
          format: float
        function:
          type: string
        address:
          type: string
        year_of_construction:
          oneOf:
            - type: integer
            - type: string
    ErrorResponse:
      type: object
      required: [message]
      properties:
        code:
          type: integer
          example: 400
        status:
          type: string
          example: Bad Request
        message:
          type: string
          example: Failed to run GIS component
        errors:
          type: object
          additionalProperties: true
      additionalProperties: true
