[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jug_sim_buildings"
version = "0.1.0"
description = "Foundation for building carbon emissions simulation scenarios."
authors = [
  { name = "Alireza Adli" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
  "flask==3.1.1",
  "flask-smorest==0.46.1",
  "marshmallow>=3.24.1,<5",
  "sabu-chassis>=0.1.1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
preparation = ["citygisoo>=0.3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["jug_sim_buildings*"]
